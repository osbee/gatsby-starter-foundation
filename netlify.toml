[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "bash scripts/dev-preview.sh"
  targetPort = 8001
  port = 8888

[[redirects]]
  from = "/api/submit-message"
  to = "/.netlify/functions/submit-message"
  status = 200

[[plugins]]
  package = "netlify-plugin-gatsby-cache"